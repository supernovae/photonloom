[package]
name = "photonloom"
version = "0.1.0"
edition = "2024"
description = "Cross-platform astrophotography calibration, registration, integration, and gallery engine"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
directories = "6.0"
fitsio = { version = "0.21", features = ["fitsio-src"] }
fitsio-sys = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
libloading = "0.8"
pollster = "0.4"
rayon = "1.10"
parking_lot = "0.12"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
rsraw = "0.1"
rsraw-sys = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
tiff = "0.9"
tokio = { version = "1.43", features = ["full"] }
walkdir = "2.5"
wgpu = "24.0"

[dev-dependencies]
tempfile = "3.15"
