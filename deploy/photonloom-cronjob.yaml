apiVersion: batch/v1
kind: CronJob
metadata:
  name: photonloom-watch-nightly
  labels:
    app.kubernetes.io/name: photonloom
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid # Do not start a second integration while one is running.
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: photonloom
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: photonloom
              image: ghcr.io/supernovae/photonloom:latest
              imagePullPolicy: IfNotPresent
              command:
                - photonloom
                - watch
                - /observations
                - --output
                - /results
                - --once
                - --settle
                - "300"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "1"
                  memory: "1Gi"
                limits:
                  cpu: "4"
                  memory: "2Gi"
              volumeMounts:
                - name: observations-volume
                  mountPath: /observations
                  readOnly: true
                - name: results-volume
                  mountPath: /results
                  readOnly: false
          volumes:
            # Shared RWX input when another pod deposits subs, or ROX when
            # an external producer supplies an already-mounted NAS directory.
            - name: observations-volume
              persistentVolumeClaim:
                claimName: photonloom-observations-pvc
                readOnly: true
            # Writable by UID/GID 10001; RWO suffices for one nightly job.
            - name: results-volume
              persistentVolumeClaim:
                claimName: photonloom-results-pvc
