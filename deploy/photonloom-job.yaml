apiVersion: batch/v1
kind: Job
metadata:
  name: photonloom-run
  labels:
    app.kubernetes.io/name: photonloom
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photonloom
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: photonloom
          image: photonloom:latest
          imagePullPolicy: IfNotPresent
          command:
            - photonloom
            - run
            - /observations
            - --output
            - /results
            - --accelerator
            - cpu
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "2Gi"
          volumeMounts:
            - name: observations-volume
              mountPath: /observations
              readOnly: true
            - name: results-volume
              mountPath: /results
              readOnly: false
      volumes:
        - name: observations-volume
          persistentVolumeClaim:
            claimName: photonloom-observations-pvc
            readOnly: true
        - name: results-volume
          persistentVolumeClaim:
            claimName: photonloom-results-pvc
